<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt</title>
    <link rel="stylesheet" href="treasureHuntMap.css">
</head>
<body>
    
    <header>

        <h1>🧭 Treasure Hunt</h1>
        <p>Find all the hidden treasures on the island!</p>

    </header>

    <main>

        <section class="map">

            <div class="tree tree1" title="tree 1">🌴</div>
            <div class="tree tree2" title="tree 2">🌴</div>
            <div class="tree tree3" title="tree 3">🌴</div>
            <div class="tree tree4" title="tree 4">🌴</div>
            <div class="tree tree5" title="tree 5">🌴</div>
            <div class="tree tree6" title="tree 6">🌴</div>

            <div class="rock rock1" title="rock 1">🗿</div>
            <div class="rock rock2" title="rock 2">🗿</div>
            <div class="rock rock3" title="rock 3">🗿</div>
            <div class="rock rock4" title="rock 4">🗿</div>

            <div class="camp" title="camp" data-message="🔥">🏕️</div>

            <div class="cave" title="cave">🕳️</div>

            <div class="pirateShip" title="pirateShip">🏴‍☠️</div>

            <div class="treasure treasure1" title="treasure 1" data-message="✨💰✨">💰</div>
            <div class="treasure treasure2" title="treasure 2" data-message="✨💰✨">💰</div>
            <div class="treasure treasure3" title="treasure 3" data-message="✨💰✨">💰</div>

        </section>

        <section class="missionPanel">

            <h2>📜 Mission Panel</h2>

            <ul>
                <li>Find the pirate ship</li>
                <li>Find the hidden cave</li>
                <li>Find 3 treasures</li>
                <li>Return safely</li>
            </ul>

        </section>
        
    </main>


</body>
</html>
