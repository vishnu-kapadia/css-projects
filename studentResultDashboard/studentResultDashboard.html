<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Dashboard</title>
    <link rel="stylesheet" href="studentResultDashboard.css">
</head>
<body>
    <!-- <h1>Student Result Sheet</h1> -->
    <table>
        <caption>
            Student Result Sheet
        </caption>
        <thead>
            <tr>
                <th scope="col">Student Name</th>
                <th scope="col">Roll No</th>
                <th scope="col">Maths</th>
                <th scope="col">Science</th>
                <th scope="col">English</th>
                <th scope="col">Total</th>
                <th scope="col">Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rahul</td>
                <td>101</td>
                <td>89</td>
                <td>92</td>
                <td>84</td>
                <td>265</td>
                <td>
                    <span class=" grade a">A</span> 
                </td>
            </tr>
            <tr>
                <td>Priya</td>
                <td>102</td>
                <td>76</td>
                <td>81</td>
                <td>78</td>
                <td>235</td>
                <td>
                    <span class="grade b">B+</span> 
                </td>
            </tr>
            <tr>
                <td>Aman</td>
                <td>103</td>
                <td>95</td>
                <td>98</td>
                <td>91</td>
                <td>284</td>
                <td>
                   <span class="grade a">A+</span>
                </td>
            </tr>
            <tr>
                <td>Neha</td>
                <td>104</td>
                <td>68</td>
                <td>72</td>
                <td>80</td>
                <td>210</td>
                <td>
                   <span class="grade b">B</span>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Average</th>
                <td colspan="6">248</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
