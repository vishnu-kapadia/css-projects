<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Character Card</title>
    <link rel="stylesheet" href="gameCharacterCard.css">
</head>
<body>

    <div class="heroCard">

        <header>
            <h1>🛡 HERO</h1>

            <figure>
                <img src="" alt="Aragon the Brave">
            </figure>

            <h2>Aragon the Brave</h2>
            <p class="level">Level 12 Warrior</p>
        </header>

        <section class="stats">
            <div class="stat">
                <div class="statTitle">
                    <span>❤️ Health</span>
                    <span>80%</span>
                </div>

                <div class="progressBar">
                    <div class="health"></div>
                </div>
            </div>

            <div class="stat">
                <div class="statTitle">
                    <span>🔵 Mana</span>
                    <span>40%</span>
                </div>
                <div class="progressBar">
                    <div class="mana"></div>
                </div>
            </div>
        </section>

         <main>
            <section class="inventory">

                <h2>🎒 Inventory</h2>

                <ul>
                    <li>⚔ Sword</li>
                    <li>🛡 Shield</li>
                    <li>🧪 Potion</li>
                    <li>👑 Helmet</li>
                </ul>
            </section>

            <section class="skills">
                <h2>✨ Skills</h2>
                <ul>
                    <li>⚔ Slash</li>
                    <li>🔥 Fireball</li>
                    <li>💨 Dash</li>
                </ul>
            </section>

        </main>

        <footer>
            <div class="footerCard">
                <h3>Guild Rank</h3>
                <p>🥈 Silver</p>
            </div>

            <div class="footerCard">
                <h3>Experience</h3>
                <p>⭐ 12,500 XP</p>
            </div>

            <div class="footerCard">
                <h3>Gold</h3>
                <p>🪙 450</p>
            </div>
        </footer>
    </div>
</body>
</html>
