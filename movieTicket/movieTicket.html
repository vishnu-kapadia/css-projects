<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="movieTicket.css">
</head>

<body>

    <header class="page-header">
        <h1>Movie Ticket Generator</h1>
        <p>Your Digital Cinema Pass</p>
    </header>

    <main>

        <section class="ticket">

            <header class="ticket-header">
                <p class="movie-type">🎬 Movie Ticket</p>

                <h2>Avengers: Endgame</h2>

                <p class="cinema-name">Marvel Cinema</p>
            </header>

            <section class="ticket-details">

                <article class="detail">
                    <h3>Date</h3>
                    <p>15 July 2026</p>
                </article>

                <article class="detail">
                    <h3>Time</h3>
                    <p>8:30 PM</p>
                </article>

                <article class="detail">
                    <h3>Seat</h3>
                    <p>G12</p>
                </article>

            </section>

            <section class="barcode">
                <div class="barcode-lines"></div>
            </section>

            <footer class="ticket-footer">
                <p>Enjoy your movie!</p>
                <button>Book Again</button>
            </footer>

        </section>

    </main>

    <footer class="page-footer">
        <p>&copy; 2026 Marvel Cinema. All Rights Reserved.</p>
    </footer>

</body>
</html>
